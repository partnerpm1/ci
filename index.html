<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #siteFrame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

<iframe
    id="siteFrame"
    allow="clipboard-read; clipboard-write"
></iframe>

<script>
(function () {

    const BASE_URL =
        'https://vitasphere.live/XSm2yDW1';

    const target = new URL(BASE_URL);

    /*
     * Берём абсолютно все параметры,
     * которые пришли на GitHub Pages.
     */
    const incoming =
        new URLSearchParams(window.location.search);

    for (const [key, value] of incoming.entries()) {
        target.searchParams.append(key, value);
    }

    /*
     * Загружаем конечный сайт внутри iframe.
     * Редиректа верхней страницы нет.
     */
    document.getElementById('siteFrame').src =
        target.toString();

})();
</script>

</body>
</html>
