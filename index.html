<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #siteFrame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

<iframe
    id="siteFrame"
    allow="clipboard-read; clipboard-write"
></iframe>

<script>
(function () {

    const BASE_URL = 'https://mysite.com/XSm2yDW1';

    const target = new URL(BASE_URL);

    const incoming = new URLSearchParams(
        window.location.search
    );

    incoming.forEach((value, key) => {
        target.searchParams.set(key, value);
    });

    const finalUrl = target.toString();

    console.log('GitHub URL:', window.location.href);
    console.log('Final iframe URL:', finalUrl);

    document.getElementById('siteFrame').src = finalUrl;

})();
</script>

</body>
</html>
